  - id: graduate_employment_survey
    source: data_gov_sg
    mode: file
    title: "Graduate Employment Survey - NTU, NUS, SIT, SMU, SUSS & SUTD"
    resource_id: d_3c55210de27fcccda2ed0c63fdd2b352
    file_path: incoming/data_gov_sg/GraduateEmploymentSurveyNTUNUSSITSMUSUSSSUTD.csv
    format: csv
    topic: [education, graduate employment, salary, university]
    column_meta:
      degree: {description: "May carry footnote markers (**, #); not yet stripped"}
      employment_rate_overall: {unit: percent}
      employment_rate_ft_perm: {unit: percent}
      basic_monthly_mean: {unit: sgd}
      basic_monthly_median: {unit: sgd}
      gross_monthly_mean: {unit: sgd}
      gross_monthly_median: {unit: sgd}
      gross_mthly_25_percentile: {unit: sgd}
      gross_mthly_75_percentile: {unit: sgd}

  - id: mom_usual_hours_by_occupation_2023
