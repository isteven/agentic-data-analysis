    title: "MOM - Usual Hours Worked by Occupation and Sex, 2023"
    resource_id: null
    file_path: incoming/mom/LFR2023_SectionF.xlsx
    sheet_name: F2
    format: xlsx
    topic: [employment, hours worked, occupation]
    year: 2023
    column_meta:
      value: {unit: thousand persons, description: "Number of employed residents aged 15+ (excl. full-time national servicemen), in thousands, in each sex x hours_bucket x occupation cell. Usual hours worked are the hours_bucket bands; compare hours between groups by each group's share of its own head count in each band"}

