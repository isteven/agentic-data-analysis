[project]
name = "apda-backend"
version = "0.1.0"
description = "Agentic Policy Data Analytics Platform - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "saq>=0.13",
    "redis>=5.2",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-aws>=0.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
    "black>=24.10",
    "locust>=2.32",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
