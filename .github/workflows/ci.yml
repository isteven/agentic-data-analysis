name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        # No DB, no LLM: unit tests mock both (see CLAUDE.md).
        env:
          PYTHONPATH: .
        run: uv run pytest tests/unit -q --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  integration:
    name: Backend integration (real Postgres, scripted LLM)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16 # matches infra/docker-compose.yml
        env:
          POSTGRES_USER: apda
          POSTGRES_PASSWORD: apda
          POSTGRES_DB: apda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apda"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Integration tests
        # Migrates and seeds the real dataset files, then checks view figures against
        # the sources' published totals and runs the full agent graph with fake LLMs.
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql+asyncpg://apda:apda@localhost:5432/apda_test
        run: uv run pytest tests/integration -v

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # LayoutProps and other route types are generated by Next into .next/types;
        # a fresh checkout has none until typegen (or dev/build) runs.
        run: npx next typegen && npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    # Proves the images the grader runs with `docker compose up` still build.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
