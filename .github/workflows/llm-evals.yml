name: LLM evals

# Real model calls cost money and are rate-limited, so this runs only on demand
# (Actions tab -> LLM evals -> Run workflow), not on every PR.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per question (consistency check)"
        default: "3"

jobs:
  evals:
    name: Accuracy, consistency and hallucination evals
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apda
          POSTGRES_PASSWORD: apda
          POSTGRES_DB: apda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apda"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run evals
        env:
          PYTHONPATH: .
          RUN_LLM_EVALS: "1"
          LLM_EVAL_RUNS: ${{ inputs.runs }}
          TEST_DATABASE_URL: postgresql+asyncpg://apda:apda@localhost:5432/apda_test
          # Repository secrets (Settings -> Secrets and variables -> Actions).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_ENABLE_BEDROCK: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BEDROCK_MODEL_ID_FAST: ${{ vars.BEDROCK_MODEL_ID_FAST }}
          BEDROCK_MODEL_ID_QUALITY: ${{ vars.BEDROCK_MODEL_ID_QUALITY }}
        run: uv run pytest tests/integration/test_llm_evals.py -v -s

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-results
          path: backend/llm-eval-results.json
